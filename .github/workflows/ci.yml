name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start LiveKit dev server
        run: |
          docker run -d --name livekit --network host livekit/livekit-server:v1.9.0 --dev --bind 127.0.0.1
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:7880 && exit 0
            sleep 1
          done
          docker logs livekit
          exit 1
      - run: go test -race -tags e2e -count=1 ./internal/lk/...
        env:
          LK9S_E2E_URL: http://127.0.0.1:7880
      - if: failure()
        run: docker logs livekit
